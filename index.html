<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mario Game Start</title>
<style>
body {
  margin: 0;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}
#startBtn {
  font-size: 40px;
  padding: 20px 40px;
  border: 3px solid #000;
  background: #fff;
  cursor: pointer;
  z-index: 1000;
}
</style>
</head>
<body>
<button id="startBtn">Start</button>

<script>
function startMarioGame(autoStart = false) {
  document.documentElement.style.background = "#fff";
  document.body.style.background = "#fff";
  document.body.innerHTML = "";

  const music = new Audio("rainbow_ride_music.mp3");
  music.loop = true;
  const deathSound = new Audio("mario_death.m4a");
  const powerUpSound = new Audio("super_mario_power_up.m4a");
  const invincibleSound = new Audio("invincible_super_mario.m4a");

  const canvas = document.createElement("canvas");
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;

  // Détection mobile
  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  // === Variables de jeu ===
  let groundY, marioY, marioVY = 0, jumping = false;
  let obstacles = [];
  let obstacleSpeed = 5;
  let frameCount = 0;
  let score = 0;
  let gameStarted = false;
  let startTime = 0;
  let paused = false;
  let deathAnimationY = 0, deathAnimationVY = -10;
  let level = 1, nextAccelerationDelay, lastAccelerationTime;
  let star = null, invincible = false, invincibleStartTime = 0;
  let starFloatOffset = 0, starFloatDirection = 1, starSpawnedThisLevel = false;
  let obstacleSpacing;

  // === HUD ===
  const scoreEl = document.createElement("div");
  scoreEl.style.position = "fixed";
  scoreEl.style.top = "10px";
  scoreEl.style.left = "20px";
  scoreEl.style.fontFamily = "monospace";
  scoreEl.style.fontSize = isMobile ? "20px" : "30px";
  scoreEl.style.color = "#000";
  scoreEl.textContent = "Score: 0";
  document.body.appendChild(scoreEl);

  const timerEl = document.createElement("div");
  timerEl.style.position = "fixed";
  timerEl.style.top = "10px";
  timerEl.style.right = "20px";
  timerEl.style.fontFamily = "monospace";
  timerEl.style.fontSize = isMobile ? "20px" : "30px";
  timerEl.style.color = "#000";
  timerEl.textContent = "0.00 sec";
  document.body.appendChild(timerEl);

  const levelEl = document.createElement("div");
  levelEl.style.position = "fixed";
  levelEl.style.top = "10px";
  levelEl.style.left = "50%";
  levelEl.style.transform = "translateX(-50%)";
  levelEl.style.fontFamily = "monospace";
  levelEl.style.fontSize = isMobile ? "20px" : "30px";
  levelEl.style.color = "#000";
  levelEl.textContent = "Level 1";
  document.body.appendChild(levelEl);

  // === Sprites ===
  const marioStand = new Image(); marioStand.src = "super_mario.png";
  const marioJump = new Image(); marioJump.src = "super_mario_jump.png";
  const marioDeath = new Image(); marioDeath.src = "super_mario_death.png";
  const starImg = new Image(); starImg.src = "super_star.png";
  const skateboardImg = new Image(); skateboardImg.src = "skateboard.png";

  // === Resize et variables liées ===
  function resizeCanvas() {
    canvas.width = isMobile ? window.innerWidth : 800;
    canvas.height = isMobile ? window.innerHeight : 400;

    groundY = canvas.height - (isMobile ? 80 : 100);
    marioY = groundY - 50;

    // Obstacle spacing proportionnel à la largeur du canvas
    obstacleSpacing = isMobile ? canvas.width * 0.8 : 650;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // === Jump ===
  function jump() { if(!jumping) { marioVY = -16; jumping = true; } }

  // === Obstacle height ===
  function getObstacleHeight() {
    let maxHeight = 65;
    let minHeight = 30;
    let highProb = Math.min(0.3 + 0.05 * Math.floor(level/2), 0.7);
    return Math.random() < highProb ? Math.floor(Math.random()*(maxHeight-50)+50)
                                    : Math.floor(Math.random()*(50-minHeight)+minHeight);
  }

  // === Start game ===
  function startGame() {
    if(!gameStarted){
      gameStarted = true;
      startTime = performance.now();
      lastAccelerationTime = performance.now();
      paused = false;
      music.play().catch(()=>{});
      gameLoop();
    }
  }

  // === Contrôles ===
  if(isMobile){
    canvas.addEventListener("touchstart", (e) => { if(gameStarted && !paused) jump(); });
  } else {
    canvas.addEventListener("click", () => { if(gameStarted && !paused) jump(); });
    window.addEventListener("keydown", e => { if(e.code==="Space" && gameStarted && !paused) jump(); });
  }

  // === Game loop ===
  function gameLoop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Sol
    ctx.fillStyle = "#000";
    ctx.fillRect(0, groundY, canvas.width, isMobile ? 8 : 10);

    // Mario + skate
    if(paused){
      deathAnimationVY += 0.5;
      deathAnimationY += deathAnimationVY;
      ctx.drawImage(marioDeath, 100, groundY-50+deathAnimationY, 50,50);
    } else {
      marioVY += 1;
      marioY += marioVY;
      if(marioY > groundY-50){ marioY=groundY-50; marioVY=0; jumping=false; }
      ctx.drawImage(jumping?marioJump:marioStand, 100, marioY, 50,50);
      ctx.drawImage(skateboardImg, 90, groundY-18, 65, 25);
    }

    // Spawn obstacles
    if(!paused){
      if(obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - obstacleSpacing){
        const height = getObstacleHeight();
        const type = Math.random() < 0.3 ? "triangle" : "square";
        obstacles.push({x: canvas.width, y: groundY - height - 15, w: 30, h: height, type: type});
      }
    }

    // Dessiner obstacles + collisions
    ctx.fillStyle="#000";
    for(let i=obstacles.length-1;i>=0;i--){
      const ob = obstacles[i];
      if(!paused) ob.x -= obstacleSpeed;

      if(ob.type === "square") ctx.fillRect(ob.x+0.5, ob.y+0.5, ob.w, ob.h);
      else if(ob.type === "triangle"){
        ctx.beginPath();
        ctx.moveTo(ob.x+0.5, ob.y+ob.h+0.5);
        ctx.lineTo(ob.x+ob.w/2, ob.y);
        ctx.lineTo(ob.x+ob.w, ob.y+ob.h+0.5);
        ctx.closePath();
        ctx.fill();
      }

      if(!invincible && !paused && 100+50>ob.x && 100<ob.x+ob.w && marioY+50>ob.y){
        paused = true;
        deathAnimationY=0;
        deathAnimationVY=-10;
        deathSound.currentTime=0;
        deathSound.play();
        music.pause();
        music.currentTime=0;
        obstacles.length=0;
        marioY = groundY-50;
        marioVY=0;
        jumping=false;
        score=0;
        obstacleSpeed=5;
        level=1;
        levelEl.textContent="Level "+level;
        nextAccelerationDelay = 15000 + Math.random()*5000;
        star = null;
        starSpawnedThisLevel = false;

        deathSound.onended = ()=>{
          paused=false;
          startTime = performance.now();
          lastAccelerationTime = performance.now();
          music.play().catch(()=>{});
        };
      }

      if(ob.x+ob.w<0){ obstacles.splice(i,1); score++; }
    }

    // HUD
    scoreEl.textContent = "Score: " + score;
    const elapsed = paused ? (timerEl.textContent?parseFloat(timerEl.textContent):0)
                           : (performance.now()-startTime)/1000;
    timerEl.textContent = elapsed.toFixed(2)+" sec";

    frameCount++;
    requestAnimationFrame(gameLoop);
  }

  if(autoStart) startGame();
}

const startBtn = document.getElementById("startBtn");
startBtn.addEventListener("click", ()=>{ startMarioGame(true); });
</script>
</body>
</html>
