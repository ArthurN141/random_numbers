<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mario Game Start</title>
<style>
body {
  margin: 0;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
#startBtn {
  font-size: 40px;
  padding: 20px 40px;
  border: 3px solid #000;
  background: #fff;
  cursor: pointer;
  z-index: 1000;
}
</style>
</head>
<body>
<button id="startBtn">Start1</button>

<script>
function isMobile() {
  return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

function startMarioGame(autoStart = false) {
  document.documentElement.style.background = "#fff";
  document.body.style.background = "#fff";
  document.body.innerHTML = "";

  const music = new Audio("rainbow_ride_music.mp3");
  music.loop = true;
  const deathSound = new Audio("mario_death.m4a");
  const powerUpSound = new Audio("super_mario_power_up.m4a");
  const invincibleSound = new Audio("invincible_super_mario.m4a");

  const canvas = document.createElement("canvas");
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;

  // === HUD ===
  const scoreEl = document.createElement("div");
  scoreEl.style.position = "fixed";
  scoreEl.style.top = "10px";
  scoreEl.style.left = "20px";
  scoreEl.style.fontFamily = "monospace";
  scoreEl.style.fontSize = "30px";
  scoreEl.style.color = "#000";
  scoreEl.textContent = "Score: 0";
  document.body.appendChild(scoreEl);

  const timerEl = document.createElement("div");
  timerEl.style.position = "fixed";
  timerEl.style.top = "10px";
  timerEl.style.right = "20px";
  timerEl.style.fontFamily = "monospace";
  timerEl.style.fontSize = "30px";
  timerEl.style.color = "#000";
  timerEl.textContent = "0.00 sec";
  document.body.appendChild(timerEl);

  const levelEl = document.createElement("div");
  levelEl.style.position = "fixed";
  levelEl.style.top = "10px";
  levelEl.style.left = "50%";
  levelEl.style.transform = "translateX(-50%)";
  levelEl.style.fontFamily = "monospace";
  levelEl.style.fontSize = "30px";
  levelEl.style.color = "#000";
  levelEl.textContent = "Level 1";
  document.body.appendChild(levelEl);

  // === Sprites ===
  const marioStand = new Image(); marioStand.src = "super_mario.png";
  const marioJump = new Image(); marioJump.src = "super_mario_jump.png";
  const marioDeath = new Image(); marioDeath.src = "super_mario_death.png";
  const starImg = new Image(); starImg.src = "super_star.png";
  const skateboardImg = new Image(); skateboardImg.src = "skateboard.png";

  let marioY, marioVY = 0, jumping = false;
  const obstacles = [];
  let obstacleSpeed = 5;
  let frameCount = 0;
  let score = 0;
  let gameStarted = false;
  let startTime = 0;
  let paused = false;
  let deathAnimationY = 0;
  let deathAnimationVY = -10;

  let level = 1;
  let nextAccelerationDelay = 15000 + Math.random() * 5000;
  let lastAccelerationTime = 0;

  // === Star / Invincible ===
  let star = null;
  let invincible = false;
  let invincibleStartTime = 0;
  let starFloatOffset = 0;
  let starFloatDirection = 1;
  let starSpawnedThisLevel = false;

  const obstacleSpacing = 650;

  function updateCanvasSize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    if(isMobile()){
      // Mobile → centre vertical + agrandi
      groundY = canvas.height/2 + 50;
      marioY = groundY - 80; // plus grand et saut plus haut
    } else {
      // PC → sol en bas
      groundY = canvas.height - 100;
      marioY = groundY - 50;
    }
  }
  let groundY;
  updateCanvasSize();
  window.addEventListener("resize", updateCanvasSize);
  window.addEventListener("orientationchange", updateCanvasSize);

  function jump() { 
    if(!jumping) { 
      marioVY = isMobile() ? -17.35 : -16.35; // saut plus haut sur mobile
      jumping = true; 
    } 
  }

  function getObstacleHeight() {
    let maxHeight = 65;
    let minHeight = 30;
    let highProb = Math.min(0.3 + 0.05 * Math.floor(level/2), 0.7);
    return Math.random() < highProb ? Math.floor(Math.random()*(maxHeight-50)+50)
                                    : Math.floor(Math.random()*(50-minHeight)+minHeight);
  }

  function startGame() {
    if(!gameStarted){
      gameStarted = true;
      startTime = performance.now();
      lastAccelerationTime = performance.now();
      paused = false;
      music.play().catch(()=>{});
      gameLoop();
    }
  }

  // === Événements ===
  canvas.addEventListener("click", () => { if(gameStarted && !paused) jump(); });
  if(isMobile()){
    canvas.addEventListener("touchstart", (e)=>{ e.preventDefault(); if(gameStarted && !paused) jump(); });
  }
  window.addEventListener("keydown", e => { if(e.code==="Space" && gameStarted && !paused) jump(); });

  function gameLoop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // === sol ===
    ctx.fillStyle = "#000";
    ctx.fillRect(0, groundY, canvas.width, 10);

    // === Mario + Skate ===
    const marioSize = isMobile() ? 90 : 50;
    const skateSize = isMobile() ? {w: 130, h: 50} : {w: 65, h: 25};
    const marioX = 100;

    // Définir position du skate selon mobile ou PC
    const skateX = isMobile() ? marioX - 10 : marioX - 10;
    const skateY = isMobile() ? groundY - 10 : groundY - 18;

    if(paused){
      deathAnimationVY += 0.5;
      deathAnimationY += deathAnimationVY;
      ctx.drawImage(marioDeath, marioX, groundY-50+deathAnimationY, marioSize, marioSize);
    } else {
      marioVY += 1;
      marioY += marioVY;
      if(marioY > groundY-marioSize){ marioY=groundY-marioSize; marioVY=0; jumping=false; }
      ctx.drawImage(jumping?marioJump:marioStand, marioX, marioY, marioSize, marioSize);
      ctx.drawImage(skateboardImg, skateX, skateY, skateSize.w, skateSize.h);
    }

    // === spawn obstacles ===
    if(!paused){
      if(obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - obstacleSpacing){
        const height = getObstacleHeight();
        const type = Math.random() < 0.3 ? "triangle" : "square";
        obstacles.push({x: canvas.width, y: groundY - height - 15, w: 30, h: height, type: type});
      }
    }

    // === spawn star ===
    if(level >= 2 && !star && !starSpawnedThisLevel){
      if(Math.random() < 0.1){
        let starY;
        if(obstacles.length > 0 && Math.random() < 0.5){
          const ob = obstacles[Math.floor(Math.random()*obstacles.length)];
          starY = ob.y - 40; 
        } else {
          starY = groundY - 50 - Math.random()*150; 
        }
        star = {x: canvas.width, y: starY, w: 40, h: 40};
      }
      starSpawnedThisLevel = true; 
    }

    // === dessiner obstacles ===
    ctx.fillStyle="#000";
    for(let i=obstacles.length-1;i>=0;i--){
      const ob = obstacles[i];
      if(!paused) ob.x -= obstacleSpeed;

      if(ob.type === "square") ctx.fillRect(ob.x+0.5, ob.y+0.5, ob.w, ob.h);
      else if(ob.type === "triangle"){
        ctx.beginPath();
        ctx.moveTo(ob.x+0.5, ob.y+ob.h+0.5);
        ctx.lineTo(ob.x+ob.w/2, ob.y);
        ctx.lineTo(ob.x+ob.w, ob.y+ob.h+0.5);
        ctx.closePath();
        ctx.fill();
      }

      if(!invincible && !paused && marioX+marioSize>ob.x && marioX<ob.x+ob.w && marioY+marioSize>ob.y){
        paused = true;
        deathAnimationY=0;
        deathAnimationVY=-10;
        deathSound.currentTime=0;
        deathSound.play();
        music.pause();
        music.currentTime=0;
        obstacles.length=0;
        marioY = groundY-marioSize;
        marioVY=0;
        jumping=false;
        score=0;
        obstacleSpeed=5;
        level=1;
        levelEl.textContent="Level "+level;
        nextAccelerationDelay = 15000 + Math.random()*5000;
        star = null;
        starSpawnedThisLevel = false;

        deathSound.onended = ()=>{
          paused=false;
          startTime = performance.now();
          lastAccelerationTime = performance.now();
          music.play().catch(()=>{});
        };
      }

      if(ob.x+ob.w<0){ obstacles.splice(i,1); score++; }
    }

    // === dessiner star ===
    if(star){
      if(!paused){
        star.x -= obstacleSpeed;
        starFloatOffset += starFloatDirection*0.5;
        if(starFloatOffset > 5 || starFloatOffset < -5) starFloatDirection*=-1;
      }
      ctx.drawImage(starImg, star.x, star.y + starFloatOffset, star.w, star.h);

      if(marioX+marioSize>star.x && marioX<star.x+star.w && marioY+marioSize>star.y+starFloatOffset && marioY<star.y+starFloatOffset+star.h){
        invincible = true;
        invincibleStartTime = performance.now();
        invincibleSound.currentTime=0;
        invincibleSound.play();
        music.pause();
        star = null;
      }

      if(star && star.x+star.w<0) star=null;
    }

    // === invincible timer ===
    if(invincible){
      const elapsedInv = performance.now() - invincibleStartTime;
      if(elapsedInv >= 14000){
        invincible = false;
        music.currentTime=0;
        music.play().catch(()=>{});
      }
    }

    // === accélération et niveau ===
    if(!paused && gameStarted){
      const now = performance.now();
      if(now - lastAccelerationTime >= nextAccelerationDelay){
        obstacleSpeed += 1;
        level++;
        levelEl.textContent="Level "+level;
        powerUpSound.currentTime=0;
        powerUpSound.play().catch(()=>{});
        lastAccelerationTime = now;
        nextAccelerationDelay = 15000 + Math.random()*5000;
        starSpawnedThisLevel = false;
      }
    }

    // === mise à jour HUD ===
    scoreEl.textContent = "Score: " + score;
    const elapsed = paused ? (timerEl.textContent?parseFloat(timerEl.textContent):0)
                           : (performance.now()-startTime)/1000;
    timerEl.textContent = elapsed.toFixed(2)+" sec";

    frameCount++;
    requestAnimationFrame(gameLoop);
  }

  if(autoStart) startGame();
}

const startBtn = document.getElementById("startBtn");
startBtn.addEventListener("click", ()=>{ startMarioGame(true); });
</script>
</body>
</html>
