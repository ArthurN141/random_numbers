<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mario Game Start</title>
  <style>
    body {
      margin: 0;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #startBtn {
      font-size: 40px;
      padding: 20px 40px;
      border: 3px solid #000;
      background: #fff;
      cursor: pointer;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <button id="startBtn">Start</button>

  <script>
    function startMarioGame(musicObj = null, autoStart = false){
      // ensure backgrounds
      document.documentElement.style.background = "#fff";
      document.body.style.background = "#fff";
      document.body.innerHTML = ""; // replace page content

      const canvas = document.createElement("canvas");
      document.body.appendChild(canvas);
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext("2d");

      // timer
      const timerEl = document.createElement("div");
      timerEl.style.position = "fixed";
      timerEl.style.top = "10px";
      timerEl.style.right = "20px";
      timerEl.style.fontFamily = "monospace";
      timerEl.style.fontSize = "30px";
      timerEl.style.color = "#000";
      document.body.appendChild(timerEl);

      const marioStand = new Image(); marioStand.src = "super_mario.png";
      const marioJump  = new Image(); marioJump.src  = "super_mario_jump.png";

      const music = musicObj || new Audio("rainbow_ride_music.m4a");
      music.loop = true;
      const deathSound = new Audio("mario_death.m4a");

      let marioY = canvas.height - 150;
      let marioVY = 0;
      let jumping = false;
      const obstacles = [];
      let obstacleSpeed = 5;
      let frameCount = 0;
      let score = 0;
      let gameStarted = false;
      let startTime = 0;

      function jump(){
        if(!jumping){ marioVY = -15; jumping = true; }
      }

      function startGame(){
        if(!gameStarted){
          gameStarted = true;
          startTime = performance.now();
          try { music.currentTime = 0; music.play().catch(()=>{}); } catch(e){}
          gameLoop();
        }
      }

      // controls
      canvas.addEventListener("click", ()=>{ if(gameStarted) jump(); });
      window.addEventListener("keydown", e => { if(e.code === "Space" && gameStarted) jump(); });

      function gameLoop(){
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const groundY = canvas.height - 100;
        ctx.fillStyle = "#000";
        ctx.fillRect(0, groundY, canvas.width, 10);

        marioVY += 1;
        marioY += marioVY;
        if(marioY > groundY - 50){ marioY = groundY - 50; marioVY = 0; jumping = false; }
        ctx.drawImage(jumping ? marioJump : marioStand, 100, marioY, 50, 50);

        // spawn obstacles
        if(frameCount % 120 === 0){
          const height = Math.floor(Math.random()*40) + 30;
          obstacles.push({ x: canvas.width, y: groundY - height, w: 30, h: height });
        }

        // move & collisions
        ctx.fillStyle = "#000";
        for(let i = obstacles.length - 1; i >= 0; i--){
          const ob = obstacles[i];
          ob.x -= obstacleSpeed;
          ctx.fillRect(ob.x, ob.y, ob.w, ob.h);

          if(100 + 50 > ob.x && 100 < ob.x + ob.w && marioY + 50 > ob.y){
            // death
            deathSound.play();
            try { music.pause(); } catch(e){}
            obstacles.length = 0;
            marioY = groundY - 50;
            marioVY = 0;
            jumping = false;
            score = 0;
            obstacleSpeed = 5;
            startTime = performance.now();
            try { music.currentTime = 0; music.play().catch(()=>{}); } catch(e){}
          }

          if(ob.x + ob.w < 0){
            obstacles.splice(i,1);
            score++;
          }
        }

        // HUD
        ctx.fillStyle = "#000";
        ctx.font = "30px monospace";
        ctx.fillText("Score: " + score, 20, 50);

        if(gameStarted){
          const elapsed = (performance.now() - startTime) / 1000;
          timerEl.textContent = elapsed.toFixed(2) + " sec";
        } else {
          timerEl.textContent = "0.00 sec";
        }

        ctx.font = "20px monospace";
        ctx.fillText("No Internet Connection", 20, canvas.height - 20);

        frameCount++;
        requestAnimationFrame(gameLoop);
      }

      if(autoStart) startGame();
    }

    // --- bouton start ---
    const startBtn = document.getElementById("startBtn");
    startBtn.addEventListener("click", () => {
      const supermarioMusic = new Audio("rainbow_ride_music.m4a");
      supermarioMusic.loop = true;
      startMarioGame(supermarioMusic, true);
    });
  </script>
</body>
</html>
